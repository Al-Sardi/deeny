<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#g)"/>
  <!-- Crescent moon: outer circle minus inner circle offset to the right -->
  <mask id="crescent">
    <rect width="512" height="512" fill="black"/>
    <circle cx="235" cy="256" r="140" fill="white"/>
    <circle cx="290" cy="246" r="115" fill="black"/>
  </mask>
  <g mask="url(#crescent)">
    <rect width="512" height="512" fill="white"/>
  </g>
  <!-- Five-pointed star -->
  <polygon
    points="330,168 339,193 366,193 344,208 353,233 330,218 307,233 316,208 294,193 321,193"
    fill="white"
  />
</svg>
